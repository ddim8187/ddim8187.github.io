<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" role="img" aria-labelledby="t d" font-family="Noto Sans KR, Noto Sans CJK KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">험버커 픽업의 North·South 코일과 시작·끝 선</title>
<desc id="d">험버커는 North(슬러그) 코일과 South(스크류) 코일 두 개로 이루어지며, 각 코일에 시작선(Start)과 끝선(Finish)이 있고 맨선이 따로 있습니다.</desc>
<rect width="820" height="380" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="700" fill="#172033">4선 험버커의 구조 (앞에서 본 모습)</text>
<rect x="50" y="60" width="300" height="120" rx="10" fill="#dfe6f5" stroke="#5b6fa8" stroke-width="2"/>
<text x="200" y="104" font-size="18" font-weight="700" fill="#2c3e78" text-anchor="middle">North 코일 (위)</text>
<text x="200" y="130" font-size="13" fill="#2c3e78" text-anchor="middle">슬러그(고정된 금속 봉) 쪽</text>
<rect x="50" y="200" width="300" height="120" rx="10" fill="#f6e3d9" stroke="#b0683e" stroke-width="2"/>
<text x="200" y="244" font-size="18" font-weight="700" fill="#7a3d1c" text-anchor="middle">South 코일 (아래)</text>
<text x="200" y="270" font-size="13" fill="#7a3d1c" text-anchor="middle">스크류(돌려서 높이를 조절하는 나사) 쪽</text>
<line x1="350" y1="84" x2="470" y2="84" stroke="#5b6fa8" stroke-width="4"/>
<circle cx="470" cy="84" r="5" fill="#5b6fa8"/>
<text x="486" y="89" font-size="15" fill="#172033">North 시작 (NS)</text>
<line x1="350" y1="148" x2="470" y2="148" stroke="#5b6fa8" stroke-width="4"/>
<circle cx="470" cy="148" r="5" fill="#5b6fa8"/>
<text x="486" y="153" font-size="15" fill="#172033">North 끝 (NF)</text>
<line x1="350" y1="224" x2="470" y2="224" stroke="#b0683e" stroke-width="4"/>
<circle cx="470" cy="224" r="5" fill="#b0683e"/>
<text x="486" y="229" font-size="15" fill="#172033">South 시작 (SS)</text>
<line x1="350" y1="288" x2="470" y2="288" stroke="#b0683e" stroke-width="4"/>
<circle cx="470" cy="288" r="5" fill="#b0683e"/>
<text x="486" y="293" font-size="15" fill="#172033">South 끝 (SF)</text>
<line x1="200" y1="320" x2="200" y2="346" stroke="#8a8f98" stroke-width="4" stroke-dasharray="7 5"/>
<line x1="200" y1="346" x2="470" y2="346" stroke="#8a8f98" stroke-width="4" stroke-dasharray="7 5"/>
<circle cx="470" cy="346" r="5" fill="#8a8f98"/>
<text x="486" y="351" font-size="15" fill="#172033">맨선 (BARE, 차폐선) · 항상 접지</text>
<text x="24" y="372" font-size="12" fill="#5a6577">각 코일의 가는 구리선이 시작(Start)과 끝(Finish)으로 나와 총 4가닥이 되고, 맨선이 하나 더 있습니다.</text>
</svg>