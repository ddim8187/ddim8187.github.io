<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" role="img" aria-labelledby="t d" font-family="Noto Sans KR, Noto Sans CJK KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">싱글코일 픽업 1개, 볼륨 팟 1개, 출력 잭 기본 배선도</title>
<desc id="d">흰색 선(핫)은 볼륨 팟 입력 단자로, 검정 선(접지)은 접지 연결선으로 보냅니다. 볼륨 팟 가운데 단자는 잭의 팁으로, 팟의 다른 쪽 바깥 단자는 접지로 연결합니다.</desc>
<rect width="860" height="470" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="700" fill="#172033">Fender 스타일 싱글코일 · 볼륨 1개 기본 배선</text>
<rect x="40" y="100" width="150" height="100" rx="10" fill="#eef1f5" stroke="#9aa3b2" stroke-width="2"/>
<text x="115" y="146" font-size="17" font-weight="700" fill="#172033" text-anchor="middle">싱글코일</text>
<text x="115" y="170" font-size="12" fill="#5a6577" text-anchor="middle">픽업</text>
<rect x="350" y="80" width="220" height="150" rx="12" fill="#eef1f5" stroke="#9aa3b2" stroke-width="2"/>
<text x="460" y="106" font-size="14" font-weight="700" fill="#172033" text-anchor="middle">볼륨 팟 (뒷면)</text>
<text x="390" y="176" font-size="13" fill="#172033" text-anchor="middle">입력</text>
<text x="460" y="176" font-size="13" fill="#172033" text-anchor="middle">출력</text>
<text x="530" y="176" font-size="13" fill="#172033" text-anchor="middle">접지</text>
<circle cx="390" cy="200" r="8" fill="#e8a33d" stroke="#fff" stroke-width="2"/>
<circle cx="460" cy="200" r="8" fill="#e8a33d" stroke="#fff" stroke-width="2"/>
<circle cx="530" cy="200" r="8" fill="#e8a33d" stroke="#fff" stroke-width="2"/>
<rect x="670" y="100" width="150" height="130" rx="12" fill="#eef1f5" stroke="#9aa3b2" stroke-width="2"/>
<text x="745" y="126" font-size="14" font-weight="700" fill="#172033" text-anchor="middle">출력 잭</text>
<text x="710" y="176" font-size="13" fill="#172033" text-anchor="middle">팁(핫)</text>
<text x="780" y="176" font-size="13" fill="#172033" text-anchor="middle">슬리브(접지)</text>
<circle cx="710" cy="200" r="8" fill="#d93a3a" stroke="#fff" stroke-width="2"/>
<circle cx="780" cy="200" r="8" fill="#172033" stroke="#fff" stroke-width="2"/>
<polyline points="190,186 270,186 270,350 780,350 780,208" fill="none" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round"/>
<polyline points="530,208 530,350" fill="none" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round"/>
<circle cx="270" cy="350" r="5" fill="#1a1a1a"/><circle cx="530" cy="350" r="5" fill="#1a1a1a"/>
<text x="290" y="376" font-size="13" fill="#172033">검정선(접지) · 팟 접지 단자 · 잭 슬리브를 한 줄로 접지 (팟 케이스도 함께)</text>
<polyline points="190,130 320,130 320,262 390,262 390,208" fill="none" stroke="#6b7280" stroke-width="7" stroke-linejoin="round"/>
<polyline points="190,130 320,130 320,262 390,262 390,208" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
<text x="200" y="120" font-size="13" fill="#172033">흰색선(핫) → 볼륨 팟 입력 단자</text>
<path d="M460,208 L460,300 L524,300 A6,6 0 0 1 536,300 L710,300 L710,208" fill="none" stroke="#e8a33d" stroke-width="5" stroke-linejoin="round"/>
<text x="548" y="290" font-size="13" fill="#172033">팟 가운데 단자 → 잭 팁</text>
<text x="24" y="416" font-size="13" fill="#172033">입력 = 핫이 들어오는 바깥 단자 / 출력 = 가운데 단자 / 접지 = 나머지 바깥 단자</text>
<text x="24" y="440" font-size="12" fill="#5a6577">빈티지 스타일 Fender 싱글코일: 흰색 = 핫, 검정 = 접지 (제조사·연식·모델에 따라 다를 수 있습니다).</text>
<text x="24" y="458" font-size="11" fill="#5a6577">선이 교차하는 곳의 작은 아치는 서로 연결되지 않는다는 표시입니다.</text>
</svg>